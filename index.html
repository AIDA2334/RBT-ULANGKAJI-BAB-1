<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuiz Interaktif RBT Tingkatan 1 - Bab 1</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --correct-bg: #ecfdf5;
            --correct-border: #10b981;
            --correct-text: #065f46;
            --wrong-bg: #fef2f2;
            --wrong-border: #ef4444;
            --wrong-text: #991b1b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }

        .quiz-container {
            width: 100%;
            max-width: 640px;
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            border: 1px solid var(--border);
        }

        .header {
            background: linear-gradient(135deg, #2563eb, #4338ca);
            color: #ffffff;
            padding: 24px;
            text-align: center;
        }

        .header h1 {
            font-size: 1.4rem;
            font-weight: 800;
            letter-spacing: 0.5px;
        }

        .header p {
            font-size: 0.85rem;
            color: #dbeafe;
            margin-top: 4px;
        }

        .body-content {
            padding: 24px;
        }

        .hidden {
            display: none !important;
        }

        /* Start Screen */
        .start-screen {
            text-align: center;
            padding: 16px 8px;
        }

        .icon-badge {
            width: 64px;
            height: 64px;
            background: #eff6ff;
            color: #2563eb;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            margin: 0 auto 16px auto;
        }

        .start-screen h2 {
            font-size: 1.25rem;
            margin-bottom: 8px;
        }

        .start-screen p {
            color: var(--text-muted);
            font-size: 0.9rem;
            line-height: 1.5;
            margin-bottom: 24px;
        }

        /* Stats Bar */
        .stats-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 12px;
        }

        .timer-badge {
            background: #f1f5f9;
            padding: 4px 12px;
            border-radius: 9999px;
            color: #334155;
            font-family: monospace;
            font-size: 0.85rem;
        }

        .timer-badge.warning {
            background: #fee2e2;
            color: #dc2626;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .progress-bg {
            width: 100%;
            height: 8px;
            background: #e2e8f0;
            border-radius: 9999px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .progress-fill {
            height: 100%;
            background: var(--primary);
            width: 0%;
            transition: width 0.3s ease;
        }

        .question-text {
            font-size: 1.05rem;
            font-weight: 700;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .option-btn {
            width: 100%;
            text-align: left;
            padding: 14px 16px;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: #ffffff;
            font-size: 0.9rem;
            color: var(--text-main);
            cursor: pointer;
            display: flex;
            align-items: flex-start;
            gap: 12px;
            transition: all 0.2s ease;
        }

        .option-btn:hover:not(:disabled) {
            background: #f8fafc;
            border-color: #cbd5e1;
        }

        .option-badge {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: #f1f5f9;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: 700;
            flex-shrink: 0;
        }

        .option-btn.selected {
            border-color: var(--primary);
            background: #eff6ff;
            color: #1e40af;
        }

        .option-btn.correct {
            border-color: var(--correct-border);
            background: var(--correct-bg);
            color: var(--correct-text);
            font-weight: 600;
        }

        .option-btn.wrong {
            border-color: var(--wrong-border);
            background: var(--wrong-bg);
            color: var(--wrong-text);
            font-weight: 600;
        }

        .explanation-box {
            background: #f8fafc;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px 16px;
            font-size: 0.85rem;
            line-height: 1.5;
            color: #334155;
            margin-bottom: 20px;
        }

        .explanation-box strong {
            display: block;
            margin-bottom: 4px;
            color: var(--text-main);
        }
